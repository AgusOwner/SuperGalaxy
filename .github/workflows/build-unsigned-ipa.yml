name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [3106, main]
  pull_request:
    branches: [3106, main]

permissions:
  contents: write

jobs:
  build:
    # macos-15 trae Xcode 16.4 (SDK hasta iphoneos18.5) — eso compila la app
    # contra un SDK viejo aunque corra en dispositivos con iOS 27. El runner
    # xcode-27 (solo Apple Silicon/arm64) trae Xcode 27 con el SDK iphoneos27.1,
    # que es contra lo que realmente queremos enlazar para dispositivos en
    # iOS 27.x. Si este runner no está disponible en tu cuenta/organización,
    # cambia esta línea de vuelta a `macos-15` (el build sigue funcionando,
    # solo que enlazado contra el SDK viejo).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and scheme
        run: |
          xcodebuild -version
          xcodebuild -list -project ThreeOneOSSix.xcodeproj

      - name: Fix script permissions
        run: chmod +x Tests/*.sh scripts/*.sh

      - name: Policy tests
        run: bash Tests/run_policy_tests.sh

      - name: Build
        run: |
          xcodebuild -project ThreeOneOSSix.xcodeproj -scheme GalaxyX \
            -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/GalaxyX.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "GalaxyX-${VERSION}-unsigned.ipa" Payload
          shasum -a 256 "GalaxyX-${VERSION}-unsigned.ipa"
          echo "IPA=GalaxyX-${VERSION}-unsigned.ipa" >> "$GITHUB_ENV"
          echo "IPA_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "IPA_BUILD=${BUILD}" >> "$GITHUB_ENV"

      # Release-gate sentinel (issue #3): derive a >=16 byte string literal
      # from the current source instead of maintaining a hardcoded constant.
      # Swift -O inlines shorter interpolation fragments, so short probes are
      # not reliable. Asserts the artifact was built from this source tree.
      - name: Verify artifact matches source
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/GalaxyX.app"
          SENTINEL=$(grep -rhoE '"[A-Za-z0-9_./=-]{16,}"' ThreeOneOSSix --include='*.swift' \
            | head -1 | tr -d '"')
          if [[ -z "$SENTINEL" ]]; then
            echo "FAIL: no >=16 byte source sentinel found" >&2
            exit 1
          fi
          COUNT=$(strings "$APP/GalaxyX" | grep -cF "$SENTINEL" || true)
          if [[ "$COUNT" -lt 1 ]]; then
            echo "FAIL: release artifact missing source sentinel '$SENTINEL'" >&2
            echo "The packaged binary does not match the current source tree." >&2
            exit 1
          fi
          echo "artifact sentinel OK (sentinel=$SENTINEL count=$COUNT)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyX-unsigned-ipa
          path: "GalaxyX-*-unsigned.ipa"